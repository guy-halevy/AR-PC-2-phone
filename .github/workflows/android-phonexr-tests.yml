name: Android PhoneXR integration tests
on:
  push:
    paths:
      - '.github/workflows/android-phonexr-tests.yml'
      - 'android-client/**'
      - 'scripts/prepare_phonexr.py'
      - 'scripts/android_startup_smoke.py'
      - 'scripts/prepare_phonevr_baseline.py'
      - 'scripts/verify_baseline_apk.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phonevr:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Checkout pinned PhoneVR and native submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: PhoneVR-Developers/PhoneVR
          ref: 7fdcebee4a662eb8a1c7a8b19774aac71820a772
          path: third_party/PhoneVR
          submodules: recursive
          persist-credentials: false
      - name: Checkout pinned Cardboard
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: nift4/cardboard
          ref: 13bc289daaf89e77fea76c616a15d85e7b2e91aa
          path: third_party/Cardboard
          persist-credentials: false
      - name: JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Android and Rust build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdk_manager"
          "$sdk_manager" 'platforms;android-34' 'build-tools;34.0.0' 'ndk;25.2.9519653' 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          rustup toolchain install 1.85.1 --profile minimal --target x86_64-linux-android
          rustup default 1.85.1
          cargo install cargo-ndk --version 3.5.4 --locked
          cargo install cbindgen --version 0.26.0 --locked
      - name: Apply documented build repairs
        run: python scripts/prepare_phonevr_baseline.py third_party/PhoneVR third_party/Cardboard --abi x86_64
      - name: Integrate PhoneXR sources
        run: python scripts/prepare_phonexr.py third_party/PhoneVR
      - name: Build pinned Cardboard SDK
        working-directory: third_party/Cardboard
        run: bash gradlew sdk:assembleRelease --no-daemon --console=plain
      - name: Stage Cardboard native dependency
        shell: bash
        run: |
          set -euo pipefail
          destination=third_party/PhoneVR/code/mobile/android/PhoneVR/cardboard
          mkdir -p "$destination"
          cp third_party/Cardboard/sdk/build/outputs/aar/sdk-release.aar "$destination/cardboard-sdk.aar"
          cp third_party/Cardboard/sdk/include/cardboard.h "$destination/cardboard.h"
      - name: Build matching ALVR native client core
        working-directory: third_party/PhoneVR/code/mobile/android/PhoneVR/ALVR
        run: cargo xtask build-client-lib --no-stdcpp --release
      - name: Build x86_64 emulator APK
        working-directory: third_party/PhoneVR/code/mobile/android/PhoneVR
        run: bash gradlew :app:assembleNoGvrDebug -x buildClientLib -x spotlessCheck --no-daemon --console=plain
      - name: Verify APK native libraries and signature
        shell: bash
        run: |
          set -euo pipefail
          apk_dir=third_party/PhoneVR/code/mobile/android/PhoneVR/app/build/outputs/apk/noGvr/debug
          python scripts/verify_baseline_apk.py "$apk_dir" --report baseline-artifact/apk-verification.json --abi x86_64
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk_dir"/*.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk_dir"/*.apk > baseline-artifact/apk-badging.txt
      - name: Allow the runner user to access its KVM device
        run: sudo setfacl -m u:$(id -un):rw /dev/kvm
      - name: Run PhoneXR instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back emulated
          script: cd third_party/PhoneVR/code/mobile/android/PhoneVR && bash gradlew :app:connectedNoGvrDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=viritualisres.phonevr.xr.XrInstrumentationTest -x buildClientLib -x spotlessCheck --no-daemon --console=plain
      - name: Upload instrumentation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PhoneXR-Android-test-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            third_party/PhoneVR/code/mobile/android/PhoneVR/app/build/reports/androidTests/**
            third_party/PhoneVR/code/mobile/android/PhoneVR/app/build/outputs/androidTest-results/**
            baseline-artifact/**
