name: Android PhoneXR integration tests
on:
  push:
    paths:
      - '.github/workflows/android-phonexr-tests.yml'
      - 'android-client/**'
      - 'scripts/verify_android_tests.py'
      - 'scripts/prepare_phonexr.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  components:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Get the pinned Gradle wrapper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: PhoneVR-Developers/PhoneVR
          ref: 7fdcebee4a662eb8a1c7a8b19774aac71820a772
          path: third_party/PhoneVR
          persist-credentials: false
          sparse-checkout: code/mobile/android/PhoneVR
      - name: JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and verify the production hand model
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          import runpy
          import urllib.request
          config = runpy.run_path('scripts/prepare_phonexr.py')
          data = urllib.request.urlopen(config['MODEL_URL'], timeout=90).read()
          assert hashlib.sha256(data).hexdigest() == config['MODEL_SHA']
          path = Path('android-client/test-app/src/main/assets/hand_landmarker.task')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(data)
      - name: Build component test APKs for the supported MediaPipe x86 ABI
        working-directory: android-client/test-app
        run: bash ../../third_party/PhoneVR/code/mobile/android/PhoneVR/gradlew assembleDebug assembleDebugAndroidTest --no-daemon --console=plain
      - name: Allow the runner user to access its KVM device
        run: sudo setfacl -m u:$(id -un):rw /dev/kvm
      - name: Run the real model, geometry, encryption and timing tests
        uses: ReactiveCircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: 30
          target: google_apis
          arch: x86
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: cd android-client/test-app && bash ../../third_party/PhoneVR/code/mobile/android/PhoneVR/gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=viritualisres.phonevr.xr.XrInstrumentationTest --no-daemon --console=plain
      - name: Require all PhoneXR tests to execute and pass
        run: python scripts/verify_android_tests.py android-client/test-app/build/outputs/androidTest-results
      - name: Upload instrumentation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PhoneXR-Android-test-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            android-client/test-app/build/reports/androidTests/**
            android-client/test-app/build/outputs/androidTest-results/**
