name: Windows diagnostic protocol
on:
  push:
    paths:
      - 'shared/protocol/**'
      - 'tests/protocol/**'
      - 'tools/packet-viewer/**'
      - 'tools/replay-tool/**'
      - '.github/workflows/windows-protocol.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test protocol and real Winsock loopback
        run: python -m unittest discover -s tests/protocol -p "test_*.py" -v
